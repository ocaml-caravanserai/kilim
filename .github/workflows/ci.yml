# The tests on each push to main and on each pull request. The tools come from
# the dev shell of flake.nix, as on a local machine. The tests run in three
# builds: native code, js_of_ocaml and wasm_of_ocaml (on node and in a
# headless Chrome).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A status line for each test, and a limit for each test: a test that hangs
# fails with its name.
# With KILIM_REQUIRE_NODE, a missing node (or a node older than 22.3.0) is a
# failure, not a skip (test/node).
env:
  WINDTRAP_VERBOSE: "1"
  WINDTRAP_TIMEOUT: "120"
  KILIM_REQUIRE_NODE: "1"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: cachix/install-nix-action@v31
      - name: Build
        run: nix develop -c dune build
      - name: Format
        run: nix develop -c dune build @fmt
      # The DOM tests need Chrome: the runner image has it in /usr/bin. With
      # this variable, a missing Chrome is a failure, not a skip.
      - name: Test
        env:
          KILIM_REQUIRE_CHROME: "1"
        run: nix develop -c dune runtest --force
      # The budget gate (docs/budgets.md): the gzip sizes in the release
      # profile against bench/size/budget, the check of the generated code,
      # the allocation counts and the exact DOM operation counts.
      - name: Budget gate
        run: nix develop -c make budgets
      # The tests of the release files: kilim dist on the release builds of
      # the loader tests and of the examples, in Chrome.
      - name: Release tests
        env:
          KILIM_REQUIRE_CHROME: "1"
        run: nix develop -c make test-release
      # The hand mutants of the loader text, on a pull request that changes
      # the loader, its tests or the browser driver (browser.mjs, chrome.mjs,
      # playwright.mjs). The checkout of a pull request is a merge commit, and
      # its first parent HEAD^1 is the base.
      - name: Changes of the loader
        id: loader
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet HEAD^1 HEAD -- src/loader test/loader test/dom/browser.mjs test/dom/chrome.mjs test/dom/playwright.mjs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Loader mutants
        if: github.event_name == 'pull_request' && steps.loader.outputs.changed == 'true'
        env:
          KILIM_REQUIRE_CHROME: "1"
        run: nix develop -c make mutate-loader

  # The tests in Firefox and WebKit (Playwright), parallel to the job test.
  # The tools come from the dev shell `browsers` of flake.nix: playwright-core
  # and the two browsers of nixpkgs, from cache.nixos.org. With
  # KILIM_REQUIRE_PLAYWRIGHT, a missing Playwright is a failure, not a skip.
  # No test retries: a flaky test can hide a fault.
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Install the shell browsers
        run: nix develop .#browsers -c true
      - name: Test in Firefox and WebKit
        env:
          KILIM_REQUIRE_PLAYWRIGHT: "1"
        run: nix develop .#browsers -c make browsers

  # The opam install of kilim.opam with the tests, as opam-repository does it,
  # with no Nix. One variant has the newest versions of the dependencies, and
  # one variant pins js_of_ocaml and wasm_of_ocaml to 6.4.1 (the version of
  # flake.lock). The js and wasm tests run on the node of actions/setup-node.
  # The runner image has Chrome in /usr/bin, thus the Chrome tests run, in the
  # release profile of -p. With KILIM_REQUIRE_CHROME, a missing Chrome is a
  # failure. Playwright is not there: these tests do a skip.
  # wasm_of_ocaml needs binaryen 119 or later, but Ubuntu 24.04 has binaryen
  # 108. Thus the job puts the binaryen release of GitHub first in PATH. The
  # depext of conf-binaryen installs the binaryen of Ubuntu, but PATH hides it.
  opam:
    name: opam (js_of_ocaml ${{ matrix.jsoo }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        jsoo: [latest, "6.4.1"]
    env:
      BINARYEN: version_133
      # The sha256 of binaryen-version_133-x86_64-linux.tar.gz.
      BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install binaryen
        run: |
          f=binaryen-$BINARYEN-x86_64-linux.tar.gz
          curl -sSfLO "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN/$f"
          echo "$BINARYEN_SHA256  $f" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/binaryen"
          tar xzf "$f" -C "$RUNNER_TEMP/binaryen" --strip-components=1
          echo "$RUNNER_TEMP/binaryen/bin" >> "$GITHUB_PATH"
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
      - name: Pin js_of_ocaml ${{ matrix.jsoo }}
        if: matrix.jsoo != 'latest'
        run: |
          opam pin add -n js_of_ocaml-compiler ${{ matrix.jsoo }}
          opam pin add -n js_of_ocaml ${{ matrix.jsoo }}
          opam pin add -n wasm_of_ocaml-compiler ${{ matrix.jsoo }}
      - name: Install the dependencies
        run: opam install . --deps-only --with-test
      - name: Versions
        run: |
          wasm-opt --version
          node --version
          opam list --columns name,version ocaml dune brr js_of_ocaml-compiler wasm_of_ocaml-compiler windtrap
      - name: Build and test
        env:
          KILIM_REQUIRE_CHROME: "1"
        run: opam exec -- dune build -p kilim @install @runtest
      - name: Lint
        run: opam lint kilim.opam

  # The mutation gate of a pull request. make mutate tests the mutants that
  # the suites (test/core, test/view, test/turn and test/dist) reach on the
  # lines that the pull request changes. It gives a failure if one of these
  # mutants survives. A mutant that no test reaches gives no failure. The
  # checkout of a pull request is a merge commit, and its first parent HEAD^1
  # is the base, thus the diff from HEAD^1 holds only the lines of the pull
  # request.
  mutation:
    name: mutation (changed lines)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: cachix/install-nix-action@v31
      - name: Test the mutants of the changed lines
        run: nix develop -c make mutate BASE=HEAD^1
